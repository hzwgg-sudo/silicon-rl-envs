name: ibex-stock-probe-temp

# TEMPORARY M2 probe: Ibex/nangate45 real-tool qualification at the pinned
# pin. DELETE before M2 close (M2-04 adds the permanent opt-in gate).
# Not referenced by default CI; runs only on pushes to codex/m2-ibex
# touching this file.

on:
  push:
    branches: [codex/m2-ibex]
    paths: [.github/workflows/ibex-stock-probe-temp.yml]
  workflow_dispatch:
    inputs:
      flow_timeout_s:
        description: "Per-run flow deadline in seconds"
        required: false
        default: "7200"

concurrency:
  group: ibex-stock-probe-temp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ibex-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ORFS_COMMIT: "036d106273e66855cd5214d49518fd0f0df7de61"
      ORFS_REPO: "https://github.com/The-OpenROAD-Project/OpenROAD-flow-scripts"
      ORFS_IMAGE: "docker.io/openroad/orfs:26Q2@sha256:7832ae885e62933fcbfc486fbd9133f8c3bd1206d15c96e93bfad97432947b61"
      FLOW_TIMEOUT_S: ${{ inputs.flow_timeout_s || '7200' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/m2-ibex

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: pip install -e .[dev]

      - name: Check out pinned ORFS commit (shallow)
        run: |
          git init orfs
          git -C orfs remote add origin "$ORFS_REPO"
          git -C orfs fetch --depth 1 origin "$ORFS_COMMIT"
          git -C orfs checkout "$ORFS_COMMIT"

      - name: Pull pinned runtime image
        run: docker pull "$ORFS_IMAGE"

      - name: Preflight gate (shared lock) + Ibex asset check
        run: |
          python scripts/check_openroad.py --orfs-checkout "$GITHUB_WORKSPACE/orfs"
          python -c "
          from scripts.generate_openroad_baseline import check_ibex_checkout
          print('ibex assets ok:', check_ibex_checkout('$GITHUB_WORKSPACE/orfs'))
          "

      - name: Generate verified Ibex baseline (stock x3, seeds 7/8/9)
        run: |
          python scripts/generate_openroad_baseline.py --task ibex \
            --orfs-checkout "$GITHUB_WORKSPACE/orfs" \
            --output /tmp/ibex-baseline.json \
            --work-parent /tmp/ibex-baseline-runs \
            --seed 7 \
            --timeout-s "$FLOW_TIMEOUT_S"
          python -c "import json; d=json.load(open('/tmp/ibex-baseline.json')); print(json.dumps({k: d.get(k) for k in ('status','task_id','task_version','metrics','tolerances')}, indent=1))"

      - name: Verify stock scores 0.5 and GCD baseline cannot grade Ibex
        run: |
          python - <<'PY'
          import json
          from silicon_env.environments.openroad import baseline as bl, grader
          from silicon_env.environments.openroad import config as gcd
          from silicon_env.environments.openroad import ibex_config as ibex
          from silicon_env.environments.openroad.metrics import GcdMetrics
          rec = bl.load_baseline("/tmp/ibex-baseline.json")
          rec = bl.validate_baseline(rec, task=ibex)
          m = rec["metrics"]
          cand = GcdMetrics(stage="final", schema="orfs-26Q2-final-v1",
                            area_um2=m["area_um2"], wns_ns=m["wns_ns"], tns_ns=m["tns_ns"],
                            routed_ok=True, drc_count=0, unconstrained_paths=0,
                            valid=True, reasons=(), notes=(), raw_refs={})
          ev = {"protected_hash": rec["protected_hash"], "orfs_commit": rec["orfs_commit"],
                "image_pinned_ref": rec["image_pinned_ref"]}
          g = grader.grade_candidate(cand, baseline_record=rec, evidence=ev, task=ibex)
          assert (g.valid, g.reward) == (True, 0.5), g.to_dict()
          print("ibex stock score:", g.reward, g.reason_codes)
          # GCD baseline must not validate under ibex (and vice versa)
          for mod, name in ((gcd, "gcd"), (ibex, "ibex")):
              other = ibex if mod is gcd else gcd
              try:
                  bl.validate_baseline(bl.load_baseline(
                      "silicon_env/environments/openroad/tasks/gcd/baseline.json"
                      if mod is gcd else "/tmp/ibex-baseline.json"), task=other)
              except Exception as exc:
                  print(f"{name}-record under other task correctly rejected: {type(exc).__name__}")
              else:
                  raise SystemExit(f"CROSS-TASK LEAK: {name} record validated under other task")
          PY

      - name: Upload compact baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibex-baseline-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            /tmp/ibex-baseline.json
            /tmp/ibex-baseline-runs/**/flow-result.json
            /tmp/ibex-baseline-runs/**/resources.txt
            /tmp/ibex-baseline-runs/**/flow-console.log
            /tmp/ibex-baseline-runs/**/logs/**/6_report.json
            /tmp/ibex-baseline-runs/**/reports/**/6_finish.rpt
            /tmp/ibex-baseline-runs/**/logs/**/5_2_route.json
